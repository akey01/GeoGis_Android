<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GeoGIS6 Mobile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #0f172a 0%, #070b14 70%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 span { color: #10b981; }
    .subtitle {
      margin: 0 0 18px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-wrap {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.15);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-bar {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      transition: width 0.4s ease;
    }
    .status {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: #34d399;
      margin-bottom: 16px;
      min-height: 32px;
    }
    .btn {
      display: none;
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #020617;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn.visible { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
        <ellipse cx="16" cy="16" rx="12" ry="8" stroke="#10B981" stroke-width="1.8"/>
        <ellipse cx="16" cy="16" rx="8" ry="12" stroke="#06B6D4" stroke-width="1.4"/>
        <circle cx="16" cy="16" r="3" fill="#10B981"/>
      </svg>
    </div>
    <h1>GeoGIS<span>6</span> Mobile</h1>
    <p class="subtitle">App Nativa de Campo<br/>PSAD56 (La Canoa) ↔ REGVEN</p>
    <div id="spinner" class="spinner"></div>
    <div class="progress-wrap"><div id="progress" class="progress-bar"></div></div>
    <div id="status" class="status">Conectando con servidor móvil GeoGIS6...</div>
    <button id="retry-btn" class="btn" type="button">Reintentar Conexión</button>
  </main>

  <script>
    const ANDROID_SERVER = 'https://geogis6-android.onrender.com';
    const MAX_ATTEMPTS = 4;

    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const progressEl = document.getElementById('progress');
    const retryBtn = document.getElementById('retry-btn');

    async function probeMobileBackend() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 14000);
      try {
        const res = await fetch(ANDROID_SERVER + '/api/health', {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        });
        if (res.ok) {
          const data = await res.json().catch(() => null);
          return Boolean(data && data.database === 'connected');
        }
        return false;
      } catch (_) {
        return false;
      } finally {
        clearTimeout(timer);
      }
    }

    async function bootApp() {
      retryBtn.classList.remove('visible');
      spinnerEl.style.display = 'block';
      statusEl.style.color = '#34d399';
      progressEl.style.width = '15%';

      for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
        progressEl.style.width = Math.min(95, attempt * 24) + '%';
        statusEl.textContent =
          attempt === 1
            ? 'Conectando con servidor móvil y PostgreSQL...'
            : 'Despertando servicio móvil en Render (intento ' + attempt + '/' + MAX_ATTEMPTS + ')...';

        const ok = await probeMobileBackend();
        if (ok) {
          progressEl.style.width = '100%';
          statusEl.textContent = 'Conectado. Abriendo GeoGIS6 Mobile...';
          window.location.replace(ANDROID_SERVER + '/dashboard');
          return;
        }

        if (attempt < MAX_ATTEMPTS) {
          await new Promise((r) => setTimeout(r, 3000));
        }
      }

      spinnerEl.style.display = 'none';
      statusEl.style.color = '#fbbf24';
      statusEl.textContent = 'No se pudo contactar al servidor móvil. Verifica tu internet y reintenta.';
      retryBtn.classList.add('visible');
    }

    retryBtn.addEventListener('click', bootApp);
    bootApp();
  </script>
</body>
</html>
