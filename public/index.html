<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GeoGIS6 Mobile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a 0%, #070b14 70%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 span { color: #10b981; }
    .subtitle {
      margin: 0 0 20px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: #34d399;
      margin-bottom: 16px;
      min-height: 32px;
    }
    .actions {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .actions.visible { display: flex; }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #020617;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
        <ellipse cx="16" cy="16" rx="12" ry="8" stroke="#10B981" stroke-width="1.8"/>
        <ellipse cx="16" cy="16" rx="8" ry="12" stroke="#06B6D4" stroke-width="1.4"/>
        <circle cx="16" cy="16" r="3" fill="#10B981"/>
      </svg>
    </div>
    <h1>GeoGIS<span>6</span> Mobile</h1>
    <p class="subtitle">Estación Cartográfica de Campo<br/>PSAD56 (La Canoa) ↔ REGVEN</p>
    <div id="spinner" class="spinner"></div>
    <div id="status" class="status">Conectando con servidor y base de datos...</div>

    <div id="actions" class="actions">
      <button id="retry-btn" class="btn" type="button">Reintentar Conexión Automática</button>
      <button id="btn-android" class="btn btn-secondary" type="button">Abrir Servidor Android (Render)</button>
      <button id="btn-monolith" class="btn btn-secondary" type="button">Abrir Servidor Principal (Render)</button>
    </div>
  </main>

  <script>
    const ENDPOINTS = [
      'https://geogis6-android.onrender.com',
      'https://geotransformer-monolith-fniu.onrender.com'
    ];

    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const actionsEl = document.getElementById('actions');
    const retryBtn = document.getElementById('retry-btn');
    const btnAndroid = document.getElementById('btn-android');
    const btnMonolith = document.getElementById('btn-monolith');

    async function probeServer(baseUrl) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        // Primero intentar lectura CORS para verificar JSON { database: 'connected' }
        const res = await fetch(baseUrl + '/api/health', {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        });
        if (res.ok) {
          const data = await res.json().catch(() => null);
          if (data && data.database === 'connected') {
            return { reachable: true, dbOk: true };
          }
          return { reachable: res.status < 404, dbOk: false };
        }
        return { reachable: false, dbOk: false };
      } catch (_) {
        // Fallback no-cors por si el servidor aún no desplegó cabeceras CORS en /api/health
        try {
          const controller2 = new AbortController();
          const timer2 = setTimeout(() => controller2.abort(), 12000);
          await fetch(baseUrl + '/login?apk=1', {
            method: 'GET',
            mode: 'no-cors',
            cache: 'no-store',
            signal: controller2.signal
          });
          clearTimeout(timer2);
          return { reachable: true, dbOk: true };
        } catch (_err2) {
          return { reachable: false, dbOk: false };
        }
      } finally {
        clearTimeout(timer);
      }
    }

    function openTarget(baseUrl) {
      window.location.replace(baseUrl + '/dashboard?apk=1');
    }

    async function bootApp() {
      actionsEl.classList.remove('visible');
      spinnerEl.style.display = 'block';
      statusEl.style.color = '#34d399';
      statusEl.textContent = 'Conectando con GeoGIS6 y Supabase PostgreSQL...';

      for (const baseUrl of ENDPOINTS) {
        statusEl.textContent = 'Verificando ' + baseUrl.replace('https://', '') + '...';
        const result = await probeServer(baseUrl);
        if (result.reachable && result.dbOk) {
          statusEl.textContent = 'Base de datos conectada. Abriendo GeoGIS6 Mobile...';
          openTarget(baseUrl);
          return;
        }
      }

      spinnerEl.style.display = 'none';
      statusEl.style.color = '#fbbf24';
      statusEl.textContent = 'El servidor en Render está despertando o sin conexión. Puedes reintentar o abrir directamente:';
      actionsEl.classList.add('visible');
    }

    retryBtn.addEventListener('click', bootApp);
    btnAndroid.addEventListener('click', () => openTarget(ENDPOINTS[0]));
    btnMonolith.addEventListener('click', () => openTarget(ENDPOINTS[1]));
    bootApp();
  </script>
</body>
</html>
