name: Build GeoGIS6 Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies (Capacitor & Next core)
        run: npm install --legacy-peer-deps

      - name: Generate native Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Ensure GPS and Internet permissions in AndroidManifest.xml
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          for perm in perms:
              if perm not in text:
                  text = text.replace("</manifest>", f"    {perm}\n</manifest>")
          manifest.write_text(text, encoding="utf-8")
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare GeoGis6_Android.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GeoGis6_Android.apk
          ls -lh GeoGis6_Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoGis6_Android_APK
          path: GeoGis6_Android.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.0
          name: GeoGIS6 Mobile v6.0.0 (Android APK)
          body: APK oficial de GeoGIS6 Mobile compilado con Capacitor 7 y Android SDK.
          files: GeoGis6_Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
