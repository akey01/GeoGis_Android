name: Build GeoGIS6 Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Ensure persistent Release Keystore
        run: |
          if [ ! -f keystore/geogis6-release.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/geogis6-release.keystore \
              -alias geogis6 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass geogis6release -keypass geogis6release \
              -dname "CN=GeoGIS6 Engineering, OU=Mobile Geodesy, O=GeoGIS6 Corp, L=Caracas, ST=DC, C=VE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/geogis6-release.keystore
            git commit -m "chore(android): add persistent release keystore [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install dependencies (Capacitor & Next core)
        run: npm install --legacy-peer-deps

      - name: Stamp APK OTA version into web bundle and apk-version.json
        id: ota_version
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          version_code = 600 + run_number
          version_name = f"6.0.{run_number}"

          html_path = Path("public/index.html")
          html = html_path.read_text(encoding="utf-8")
          html = re.sub(r"const APP_VERSION_CODE\s*=\s*\d+;", f"const APP_VERSION_CODE = {version_code};", html, count=1)
          html = re.sub(r"const APP_VERSION_NAME\s*=\s*'[^']+';", f"const APP_VERSION_NAME = '{version_name}';", html, count=1)
          html = re.sub(r'id="btn-ota-header"([^>]*)>\s*v6\.0\.\d+\s*</button>', f'id="btn-ota-header"\\1>v{version_name}</button>', html, count=1)
          html_path.write_text(html, encoding="utf-8")

          manifest_path = Path("public/apk-version.json")
          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "buildNumber": run_number,
              "publishedAt": datetime.now(timezone.utc).isoformat(),
              "downloadUrl": "https://github.com/akey01/GeoGis_Android/releases/latest/download/GeoGis6_Android.apk",
              "releaseApiUrl": "https://api.github.com/repos/akey01/GeoGis_Android/releases/latest",
              "notes": f"Compilación v{version_name} (Build {version_code}): Parcelas Desktop, Proyectos PostgreSQL/Local, Login Integrado y Auto-Update OTA."
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"version_code={version_code}\n")
                  f.write(f"version_name={version_name}\n")
          print(f"Stamped OTA version v{version_name} (code={version_code})")
          EOF

      - name: Generate native Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Release signing and versioning in android/app/build.gradle
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          gradle_path = Path("android/app/build.gradle")
          text = gradle_path.read_text(encoding="utf-8")

          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          version_code = 600 + run_number
          version_name = f"6.0.{run_number}"

          text = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', text, count=1)

          signing_block = '''    signingConfigs {
                  release {
                      storeFile file("../../keystore/geogis6-release.keystore")
                      storePassword "geogis6release"
                      keyAlias "geogis6"
                      keyPassword "geogis6release"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {'''

          if 'signingConfigs' not in text:
              assert '    buildTypes {' in text, "buildTypes block not found"
              text = text.replace('    buildTypes {', signing_block, 1)

          release_pattern = re.compile(r'(buildTypes\s*\{\s*release\s*\{)', re.MULTILINE)
          assert release_pattern.search(text), "release buildType not found"
          text = release_pattern.sub(
              r'\1\n            signingConfig signingConfigs.release\n            shrinkResources false',
              text,
              count=1,
          )

          gradle_path.write_text(text, encoding="utf-8")
          print(gradle_path.read_text(encoding="utf-8"))
          EOF

      - name: Ensure GPS, Internet and Cleartext permissions in AndroidManifest.xml
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          for perm in perms:
              if perm not in text:
                  text = text.replace("</manifest>", f"    {perm}\n</manifest>")
          manifest.write_text(text, encoding="utf-8")
          EOF

      - name: Configure runtime GPS permissions and WebView geolocation in MainActivity.java
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          candidates = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          assert candidates, "MainActivity.java not found"
          main_activity = candidates[0]

          package_line = "package com.geogis6.mobile;"
          for line in main_activity.read_text(encoding="utf-8").splitlines():
              if line.strip().startswith("package "):
                  package_line = line.strip()
                  break

          java_code = f'''{package_line}

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.DownloadListener;
          import android.webkit.GeolocationPermissions;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {{
              private static final int LOCATION_PERMISSION_REQUEST_CODE = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  if (window != null) {{
                      window.setStatusBarColor(0xFF060E20);
                      window.setNavigationBarColor(0xFF060E20);
                      WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, window.getDecorView());
                      if (controller != null) {{
                          controller.setAppearanceLightStatusBars(false);
                          controller.setAppearanceLightNavigationBars(false);
                      }}
                  }}

                  View rootView = findViewById(android.R.id.content);
                  if (rootView != null) {{
                      rootView.setBackgroundColor(0xFF060E20);
                      ViewCompat.setOnApplyWindowInsetsListener(rootView, (v, windowInsets) -> {{
                          Insets insets = windowInsets.getInsets(
                              WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout()
                          );
                          v.setPadding(insets.left, insets.top, insets.right, insets.bottom);
                          return WindowInsetsCompat.CONSUMED;
                      }});
                      ViewCompat.requestApplyInsets(rootView);
                  }}

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED
                          || ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {{
                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          }},
                          LOCATION_PERMISSION_REQUEST_CODE
                      );
                  }}

                  if (this.getBridge() != null && this.getBridge().getWebView() != null) {{
                      this.getBridge().getWebView().setDownloadListener(new DownloadListener() {{
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {{
                              try {{
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(intent);
                              }} catch (Exception ignored) {{
                              }}
                          }}
                      }});
                      this.getBridge().getWebView().setWebChromeClient(
                          new BridgeWebChromeClient(this.getBridge()) {{
                              @Override
                              public void onGeolocationPermissionsShowPrompt(
                                      String origin, GeolocationPermissions.Callback callback) {{
                                  callback.invoke(origin, true, false);
                              }}
                          }}
                      );
                  }}
              }}
          }}
          '''

          # Strip the 10-space YAML indentation cleanly
          dedented = "\n".join(line[10:] if line.startswith("          ") else line for line in java_code.splitlines()) + "\n"
          main_activity.write_text(dedented, encoding="utf-8")
          print(f"Updated {main_activity}")
          print(main_activity.read_text(encoding="utf-8"))
          EOF

      - name: Build Signed Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare GeoGis6_Android.apk and verify signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk GeoGis6_Android.apk
          ls -lh GeoGis6_Android.apk
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -name apksigner | sort -V | tail -n 1)"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs GeoGis6_Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoGis6_Android_APK
          path: GeoGis6_Android.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.0
          name: GeoGIS6 Mobile v6.0.0 (Android APK)
          body: |
            APK oficial de producción de GeoGIS6 Mobile (Release firmada v1+v2) compilado con Capacitor 7 y Android SDK.
            [APK_VERSION_CODE=${{ steps.ota_version.outputs.version_code }}] [APK_VERSION_NAME=${{ steps.ota_version.outputs.version_name }}]
            Incluye Manejo Multiparcela Desktop, Gestión de Proyectos Cloud PostgreSQL/Local, Login Integrado y Auto-Actualizaciones OTA.
          files: |
            GeoGis6_Android.apk
            public/apk-version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
